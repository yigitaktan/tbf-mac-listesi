<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maç Listesi</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: #f4f6f8;
    color: #1c1e21;
  }
  .wrap { max-width: 960px; margin: 0 auto; padding: 16px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .chip {
    background: #fff; border: 1px solid #dfe3e8; border-radius: 999px;
    padding: 6px 12px; font-size: 14px;
  }
  .card {
    background: #fff; border: 1px solid #dfe3e8; border-radius: 16px;
    overflow: hidden; box-shadow: 0 6px 18px rgba(0,0,0,.05);
  }
  .card-head {
    display: flex; justify-content: space-between; align-items: center;
    gap: 8px; padding: 12px 16px; border-bottom: 1px solid #eceff2;
  }
  .btn {
    cursor: pointer; border-radius: 10px; border: 1px solid #0b57d0;
    background: #0b57d0; color: #fff; padding: 8px 14px; font-size: 14px;
  }
  .btn:disabled { opacity: .7; cursor: default; }
  .btn-outline { background: #fff; color: #0b57d0; }
  .state { padding: 36px 16px; text-align: center; color: #6b7280; }
  .state.error { color: #b91c1c; }

  /* Masaüstü: tablo görünümü */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; min-width: 700px; }
  th, td {
    text-align: left; padding: 10px 12px; border-bottom: 1px solid #eceff2;
    font-size: 14px; vertical-align: middle;
  }
  thead th { background: #fafbfc; font-weight: 600; }
  tbody tr:last-child td { border-bottom: 0; }
  tbody tr:nth-child(odd) { background: rgba(0,0,0,.015); }
  .nowrap { white-space: nowrap; }

  /* Mobil: kart görünümü */
  .match-cards { display: none; }
  .match-card { padding: 14px 16px; border-bottom: 1px solid #eceff2; }
  .match-card:last-child { border-bottom: 0; }
  .match-teams { font-weight: 600; font-size: 15px; margin-bottom: 8px; }
  .match-teams .vs { color: #9ca3af; font-weight: 400; }
  .match-meta { color: #4b5563; font-size: 14px; line-height: 1.8; }
  .match-card .btn-outline { margin-top: 12px; width: 100%; }

  @media (max-width: 700px) {
    .table-wrap { display: none; }
    .match-cards { display: block; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="chips">
      <span class="chip">Kategori: <strong id="chipCat">—</strong></span>
      <span class="chip">Takım: <strong id="chipTeam">—</strong></span>
    </div>
    <div class="card">
      <div class="card-head">
        <strong>Maçlar</strong>
        <button type="button" id="copyAll" class="btn" hidden>Tümünü Kopyala</button>
      </div>
      <div id="content"><div class="state">Yükleniyor…</div></div>
    </div>
  </div>

<script>
// ======================= AYAR =======================
// Apps Script web app URL'in (sonu /exec ile bitmeli).
// Yeni bir deployment OLUŞTURURSAN (mevcut olanı düzenlemek yerine) URL değişir,
// o zaman burayı da güncellemen gerekir.
var API_URL = 'https://script.google.com/macros/s/AKfycbzDsON93YsfeuaZ6ZNRDh_34QwmAgI6Z-F1xfJ_EJRdG1gDMoJNucPkxHKdHwWv72it/exec';
// ====================================================

var DATA = null;

// Bu sayfanın URL parametrelerini (category, team) Apps Script'e aynen aktar
var qs = new URLSearchParams(location.search);
var apiParams = new URLSearchParams({ format: 'json' });
if (qs.get('category')) apiParams.set('category', qs.get('category'));
if (qs.get('team')) apiParams.set('team', qs.get('team'));

function esc(s) {
  return (s == null ? '' : String(s))
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

/* ---- WhatsApp kopyalama formatı ----
   *A Takımı vs B Takımı*
   (boş satır)
   📅 tarih
   ⏰ saat
   🏟 salon
*/
function rowText(r) {
  return '*' + r.a + ' vs ' + r.b + '*\n\n' +
         '\uD83D\uDCC5 ' + r.tarih + '\n' +
         '\u23F0 ' + r.saat + '\n' +
         '\uD83C\uDFDF ' + r.salon;
}

function allText() {
  return '*' + DATA.team + ' - ' + DATA.category + ' Ma\u00E7 Listesi*\n\n' +
         DATA.rows.map(rowText).join('\n\n');
}

function fallbackCopy(text) {
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  try { document.execCommand('copy'); } catch (e) {}
  document.body.removeChild(ta);
}

function showDone(btn) {
  var old = btn.textContent;
  btn.textContent = 'Kopyalandı ✓';
  btn.disabled = true;
  setTimeout(function () { btn.textContent = old; btn.disabled = false; }, 1500);
}

function doCopy(text, btn) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text)
      .then(function () { showDone(btn); })
      .catch(function () { fallbackCopy(text); showDone(btn); });
  } else {
    fallbackCopy(text);
    showDone(btn);
  }
}

function render(data) {
  DATA = data;
  document.getElementById('chipCat').textContent = data.category || '—';
  document.getElementById('chipTeam').textContent = data.team || '—';
  document.title = (data.team || '') + ' - ' + (data.category || '') + ' Maç Listesi';

  var content = document.getElementById('content');
  if (!data.rows || data.rows.length === 0) {
    content.innerHTML = '<div class="state">Hiç maç bulunamadı.</div>';
    return;
  }
  document.getElementById('copyAll').hidden = false;

  var tbody = '';
  var cards = '';
  for (var i = 0; i < data.rows.length; i++) {
    var r = data.rows[i];

    // Masaüstü tablo satırı
    tbody +=
      '<tr>' +
        '<td class="nowrap">' + esc(r.tarih) + '</td>' +
        '<td class="nowrap">' + esc(r.saat) + '</td>' +
        '<td>' + esc(r.salon) + '</td>' +
        '<td>' + esc(r.a) + '</td>' +
        '<td>' + esc(r.b) + '</td>' +
        '<td style="text-align:right">' +
          '<button type="button" class="btn btn-outline copy-btn" data-i="' + i + '">Kopyala</button>' +
        '</td>' +
      '</tr>';

    // Mobil kart
    cards +=
      '<div class="match-card">' +
        '<div class="match-teams">' + esc(r.a) + ' <span class="vs">vs</span> ' + esc(r.b) + '</div>' +
        '<div class="match-meta">' +
          '\uD83D\uDCC5 ' + esc(r.tarih) + '<br>' +
          '\u23F0 ' + esc(r.saat) + '<br>' +
          '\uD83C\uDFDF ' + esc(r.salon) +
        '</div>' +
        '<button type="button" class="btn btn-outline copy-btn" data-i="' + i + '">Kopyala</button>' +
      '</div>';
  }

  content.innerHTML =
    '<div class="table-wrap"><table>' +
      '<thead><tr>' +
        '<th>Tarih</th><th>Saat</th><th>Salon</th><th>A Takımı</th><th>B Takımı</th><th></th>' +
      '</tr></thead>' +
      '<tbody>' + tbody + '</tbody>' +
    '</table></div>' +
    '<div class="match-cards">' + cards + '</div>';
}

document.addEventListener('click', function (ev) {
  var rowBtn = ev.target.closest('.copy-btn');
  if (rowBtn && DATA) {
    var idx = parseInt(rowBtn.getAttribute('data-i'), 10);
    if (DATA.rows[idx]) doCopy(rowText(DATA.rows[idx]), rowBtn);
    return;
  }
  if (ev.target.closest('#copyAll') && DATA) {
    doCopy(allText(), document.getElementById('copyAll'));
  }
});

fetch(API_URL + '?' + apiParams.toString())
  .then(function (resp) {
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    return resp.json();
  })
  .then(render)
  .catch(function (err) {
    document.getElementById('content').innerHTML =
      '<div class="state error">Veri alınamadı. Apps Script deployment ayarını kontrol et ' +
      '(Who has access: <strong>Anyone</strong> olmalı).<br><small>' + esc(err.message) + '</small></div>';
  });
</script>
</body>
</html>
